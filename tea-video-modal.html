<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhu Milan - The Perfect Brew Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA7C11;
            --dark-bg: #0F1412;
            --card-bg: #18201D;
            --text-light: #F5F5F5;
            --text-muted: #A0AAB0;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: var(--text-light); font-family: var(--font-body); padding: 40px 20px; }

        .container { max-width: 1000px; margin: 0 auto; text-align: center; }

        .gold-text {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title { font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); margin-bottom: 40px; }

        /* Video Showcase Wrapper */
        .video-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-container video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Interactive Timeline Overlay */
        .timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 25px;
            background: #121816;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
        }

        .step-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .step-box:hover, .step-box.active {
            border-color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-3px);
        }

        .step-box i { color: var(--gold-primary); font-size: 1.3rem; margin-bottom: 8px; }
        .step-time { font-size: 0.8rem; color: var(--gold-light); font-weight: 600; display: block; }
        .step-title { font-size: 0.95rem; font-weight: 600; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title gold-text">Art of Preparation</h1>
        <p class="subtitle">Watch how to brew the perfect cup of royal Assam tea with Madhu Milan</p>

        <div class="video-card">
            <div class="video-container">
                <!-- Using high-quality video placeholder; replace source URL with your actual MP4 video -->
                <video id="teaVideo" controls poster="https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&q=80&w=1200">
                    <source src="https://assets.mixkit.co/videos/preview/mixkit-pouring-hot-tea-into-a-cup-42898-large.mp4" type="video/mp4">
                    Your browser does not support video playback.
                </video>
            </div>

            <!-- Clickable Interactive Video Timestamps -->
            <div class="timeline">
                <div class="step-box" onclick="jumpToTime(0)">
                    <i class="fa-solid fa-fire-burner"></i>
                    <span class="step-time">0:00 - Step 1</span>
                    <div class="step-title">Boil Fresh Water</div>
                </div>
                <div class="step-box" onclick="jumpToTime(4)">
                    <i class="fa-solid fa-leaf"></i>
                    <span class="step-time">0:04 - Step 2</span>
                    <div class="step-title">Add Madhu Milan Tea</div>
                </div>
                <div class="step-box" onclick="jumpToTime(8)">
                    <i class="fa-solid fa-cow"></i>
                    <span class="step-time">0:08 - Step 3</span>
                    <div class="step-title">Pour Fresh Milk</div>
                </div>
                <div class="step-box" onclick="jumpToTime(12)">
                    <i class="fa-solid fa-mug-hot"></i>
                    <span class="step-time">0:12 - Step 4</span>
                    <div class="step-title">Strain & Serve Royal</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('teaVideo');

        function jumpToTime(seconds) {
            video.currentTime = seconds;
            video.play();
        }
    </script>
</body>
</html>
