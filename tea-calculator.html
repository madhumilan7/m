<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhu Milan - Tea Usage Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --dark-bg: #0F1412;
            --card-bg: #18201D;
            --text-light: #F5F5F5;
            --text-muted: #A0AAB0;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: var(--text-light); font-family: var(--font-body); padding: 50px 20px; }

        .calc-card {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .gold-text {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { font-family: var(--font-heading); text-align: center; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0D1210;
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #FFF;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }

        input:focus, select:focus { border-color: var(--gold-primary); }

        .result-box {
            background: rgba(212, 175, 55, 0.08);
            border: 1px dashed var(--gold-primary);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
        }

        .result-val { font-size: 1.8rem; font-weight: 700; color: var(--gold-primary); margin: 5px 0; }
        .order-link {
            display: inline-block;
            margin-top: 15px;
            background: var(--gold-primary);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="calc-card">
        <h2 class="gold-text">Tea Quantity Calculator</h2>
        
        <div class="form-group">
            <label for="cupsPerDay">How many cups of tea do you prepare daily?</label>
            <input type="number" id="cupsPerDay" value="20" min="1" oninput="calculateTea()">
        </div>

        <div class="form-group">
            <label for="period">Planning duration:</label>
            <select id="period" onchange="calculateTea()">
                <option value="30">Monthly (30 Days)</option>
                <option value="90">Quarterly (90 Days)</option>
                <option value="365">Yearly (365 Days)</option>
            </select>
        </div>

        <div class="result-box">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Recommended Pack Requirement:</span>
            <div class="result-val" id="resultKg">1.2 KG</div>
            <p style="font-size: 0.85rem; color: var(--text-muted);" id="recommendation">We recommend getting a 1 KG pack + 250g pack.</p>
            
            <a id="calcWaBtn" href="https://wa.me/916378266173" class="order-link" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> Order Required Amount
            </a>
        </div>
    </div>

    <script>
        function calculateTea() {
            const cups = parseFloat(document.getElementById('cupsPerDay').value) || 0;
            const days = parseInt(document.getElementById('period').value);

            // Average tea leaf usage: ~2 grams per standard cup
            const totalGrams = cups * days * 2;
            const totalKg = (totalGrams / 1000).toFixed(2);

            document.getElementById('resultKg').innerText = `${totalKg} KG`;

            const waMsg = encodeURIComponent(`Hello Madhu Milan Tea, based on my requirement of ${cups} cups/day, I need approximately ${totalKg} KG of tea.`);
            document.getElementById('calcWaBtn').href = `https://wa.me/916378266173?text=${waMsg}`;
        }

        calculateTea();
    </script>
</body>
</html>
